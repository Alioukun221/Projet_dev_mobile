name: spendwise
description: "It's a personal finance management app that helps users track their expenses, set budgets, and gain insights into their spending habits."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0


dependencies:
  flutter:
    sdk: flutter

  flutter_localizations: # Add this line
    sdk: flutter         # Add this line

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.5
  fl_chart: ^0.71.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.0
  provider: ^6.1.5
  supabase_flutter: ^2.8.4
  connectivity_plus: ^6.1.4
  notification_listener_service: ^0.3.1
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  share_plus: ^10.0.0
  google_sign_in: ^6.2.2
  telephony: ^0.2.0
  http: ^1.6.0
  gpt_markdown: ^1.1.7


analyzer:
  errors:
    missing_metadata_for_key: ignore


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.5.0
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/new_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/new_logo-removebg-removenm.png"
  web:
    generate: true
    image_path: "assets/images/new_logo-removebg-removenm.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/images/new_logo-removebg-removenm.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/new_logo-removebg-removenm.png"


flutter:
  generate: true # Add this line


  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/dev_avatar.jpg
    - assets/images/new_logo.png
    - assets/images/new_logo-removebg.png
    - assets/images/new_logo-removebg-removenm.png
    - assets/images/logo_google.png
    - assets/images/logo_google.png
